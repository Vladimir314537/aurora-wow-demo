<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora 4.0 — Зеркало Будущего</title>
    <link rel="stylesheet" href="mirror.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">🌌 Aurora 4.0</div>
        </header>

        <main class="main-content">
            <div class="left-panel">
                <div class="input-section">
                    <h2><i class="fas fa-brain"></i> Анализ паттернов мышления</h2>
                    
                    <textarea id="thought-input" rows="8">
Чувствую постоянный стресс на работе. Начальник требует слишком много, коллеги конфликтуют, нет энергии на личную жизнь.</textarea>
                    
                    <div class="quick-tags">
                        <button class="quick-tag" data-note="work">Рабочий стресс</button>
                        <button class="quick-tag" data-note="relationships">Отношения</button>
                    </div>
                    
                    <button class="analyze-btn" id="analyze-btn">
                        <i class="fas fa-search"></i> Анализировать локально
                    </button>
                </div>
            </div>

            <div class="right-panel">
                <div class="mirror-section">
                    <h2><i class="fas fa-crystal-ball"></i> Зеркало Будущего</h2>
                    
                    <select id="timeframe-select">
                        <option value="7">7 дней</option>
                        <option value="30" selected>30 дней</option>
                        <option value="90">90 дней</option>
                    </select>
                    
                    <div class="scenarios">
                        <div class="scenario red">
                            <h3>Путь продолжения <span id="prob-red">75%</span></h3>
                            <p id="scenario-red">При сохранении текущих паттернов...</p>
                        </div>
                        
                        <div class="scenario orange">
                            <h3>Управляемые изменения <span id="prob-orange">20%</span></h3>
                            <p id="scenario-orange">При внедрении практик...</p>
                        </div>
                        
                        <div class="scenario blue">
                            <h3>Качественный прорыв <span id="prob-blue">5%</span></h3>
                            <p id="scenario-blue">При трансформации подхода...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
    // ПРОСТОЙ РАБОЧИЙ КОД
    
    const SCENARIOS = {
        work: {
            red: 'РАБОТА: При сохранении текущих паттернов: усиление выгорания, снижение продуктивности.',
            orange: 'РАБОТА: При внедрении практик саморегуляции: улучшение состояния на 40%.',
            blue: 'РАБОТА: При трансформации подхода: переосмысление карьерного пути.'
        },
        relationships: {
            red: 'ОТНОШЕНИЯ: Эскалация конфликтов, эмоциональное отдаление.',
            orange: 'ОТНОШЕНИЯ: Улучшение коммуникации на 60%, укрепление связи.',
            blue: 'ОТНОШЕНИЯ: Глубокое переосмысление отношений.'
        }
    };

    // 1. Кнопка анализа
    document.getElementById('analyze-btn').addEventListener('click', function() {
        const text = document.getElementById('thought-input').value;
        let topic = 'work';
        
        if (text.includes('отнош') || text.includes('партнёр')) {
            topic = 'relationships';
        }
        
        // Обновляем сценарии
        document.getElementById('scenario-red').textContent = SCENARIOS[topic].red;
        document.getElementById('scenario-orange').textContent = SCENARIOS[topic].orange;
        document.getElementById('scenario-blue').textContent = SCENARIOS[topic].blue;
        
        alert('✅ Анализ завершён! Тема: ' + topic);
    });

    // 2. Быстрые заметки - ТОЛЬКО загружаем текст
    document.querySelectorAll('.quick-tag').forEach(button => {
        button.addEventListener('click', function() {
            const topic = this.getAttribute('data-note');
            const texts = {
                work: 'Чувствую постоянный стресс на работе...',
                relationships: 'Постоянные конфликты с партнёром...'
            };
            
            document.getElementById('thought-input').value = texts[topic] || '';
            alert('Загружена заметка: ' + this.textContent);
        });
    });

    // 3. Смена периода
    document.getElementById('timeframe-select').addEventListener('change', function() {
        const days = this.value;
        alert('Проекция изменена на ' + days + ' дней');
    });

    console.log('🚀 Aurora Mirror загружен и готов к работе!');
    </script>
</body>
</html>
